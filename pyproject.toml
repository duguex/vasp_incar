[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-tools"
version = "0.3.0"
description = "DFT knowledge, input generation, conversion, and advice on existing inputs (VASP + OpenMX)"
requires-python = ">=3.10"
dependencies = ["pydantic"]

[project.optional-dependencies]
# Shared
semantic = ["sentence-transformers"]
# vasp-query
search = ["tantivy"]
fetch = ["requests", "beautifulsoup4", "tqdm"]
# omx-tools
gen = ["ase>=3.22"]
vasp2omx = ["pymatgen"]
# Convenience combos
vasp = ["sentence-transformers", "tantivy"]
omx = ["ase>=3.22", "pymatgen", "beautifulsoup4"]
all = ["sentence-transformers", "tantivy", "requests", "beautifulsoup4",
       "tqdm", "ase>=3.22", "pymatgen"]

[project.scripts]
# User-facing convenience commands; integrations should import Python modules directly.
# CRISP remains an optional external verification backend, not a package dependency.
# vasp-query
vasp-query = "vasp_query.query:main"
vasp-gen = "vasp_query.generator:cli"
# omx-tools
omx-db = "omx_tools.database:cli"
omx-gen = "omx_tools.generator:cli"
vasp2omx = "omx_tools.vasp2omx:cli"
omp2vasp = "omx_tools.omp2vasp:cli"
# unified CLI
dft = "dft_utils.cli:main"

[project.entry-points."dft_tools.plugins"]
vasp = "vasp_query.plugin:plugin"
omx = "omx_tools.plugin:plugin"

[tool.setuptools.packages.find]
include = ["vasp_query*", "omx_tools*", "dft_utils*"]

[tool.setuptools.package-data]
vasp_query = ["data/**/*", "schemas/*.json"]
omx_tools = ["schemas/*.json"]
